# ============================================================
#  每日市場報告 — 設定檔
#  改完存檔即可，下一次執行就會生效（不用重啟任何東西）
# ============================================================

timezone: Asia/Taipei
language: zh-TW

# ------------------------------------------------------------
#  自選觀察清單：固定每份報告都會有專屬區塊
#  台股請填代號（不用加 .TW），美股填 ticker
# ------------------------------------------------------------
watchlist:
  tw: ["2330", "2317", "2454", "0050"]
  us: ["NVDA", "TSM", "AAPL", "MSFT"]

# ------------------------------------------------------------
#  自動挑選的漲跌榜 / 熱門股（不依賴自選清單，每次都會有個股）
# ------------------------------------------------------------
auto_movers:
  tw:
    top_n: 5                    # 漲幅前 N、跌幅前 N、成交金額前 N
    min_turnover_ntd: 1000000000  # 成交金額門檻 (NT$)，過濾冷門股，預設 10 億
  us:
    top_n: 5
    universe: large_caps        # 掃描範圍：下面 us_universe 這組

# 美股顯示名稱（yfinance 不附公司名，這裡沒列的就顯示 ticker）
us_names:
  NVDA: 輝達
  TSM: 台積電 ADR
  AAPL: 蘋果
  MSFT: 微軟
  AMZN: 亞馬遜
  GOOGL: Alphabet
  META: Meta
  TSLA: 特斯拉
  AVGO: 博通
  AMD: 超微
  INTC: 英特爾
  QCOM: 高通
  MU: 美光
  ASML: ASML
  AMAT: 應用材料
  LRCX: 科林研發
  ORCL: 甲骨文
  NFLX: Netflix
  COST: 好市多
  WMT: 沃爾瑪
  JPM: 摩根大通
  XOM: 埃克森美孚
  PLTR: Palantir
  SMCI: 美超微
  MRVL: Marvell

# 美股掃描範圍（yfinance 一次批次下載，數量控制在 ~60 檔以內比較快）
us_universe:
  - AAPL
  - MSFT
  - NVDA
  - AMZN
  - GOOGL
  - META
  - TSLA
  - AVGO
  - TSM
  - AMD
