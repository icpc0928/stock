# ------------------------------------------------------------
#  指數 / 總經指標（yfinance 代號: 顯示名稱）
# ------------------------------------------------------------
indices:
  us:
    "^GSPC": "S&P 500"
    "^IXIC": "Nasdaq"
    "^DJI": "道瓊工業"
    "^SOX": "費城半導體"
    "^RUT": "羅素 2000"
  macro:
    "^VIX": "VIX 恐慌指數"
    "^TNX": "美債 10 年殖利率"
    "DX-Y.NYB": "美元指數"
    "TWD=X": "USD/TWD"
    "GC=F": "黃金"
    "CL=F": "WTI 原油"
    "BTC-USD": "比特幣"
  futures:                      # 早報用：亞洲盤時段的美股期貨
    "ES=F": "S&P 500 期貨"
    "NQ=F": "Nasdaq 期貨"
  tw:
    "^TWII": "加權指數"

# 美股 11 個 SPDR 類股 ETF
us_sectors:
  XLK: "科技"
  XLC: "通訊"
  XLY: "非必需消費"
  XLP: "必需消費"
  XLV: "醫療"
  XLF: "金融"
  XLI: "工業"
  XLE: "能源"
  XLB: "原物料"
  XLRE: "不動產"
  XLU: "公用事業"

# 台股主要分類指數（TWSE 名稱，用來從 MI_INDEX 表裡挑出要顯示的類股）
tw_sectors:
  - "半導體類指數"
  - "電子類指數"
  - "電腦及週邊設備類指數"
  - "光電類指數"
  - "通信網路類指數"
  - "電子零組件類指數"
  - "金融保險類指數"
  - "航運類指數"
  - "鋼鐵類指數"
  - "塑膠類指數"
  - "生技醫療類指數"
  - "電機機械類指數"
  - "建材營造類指數"
  - "觀光餐旅類指數"

# ------------------------------------------------------------
#  新聞：Google News RSS（免 API key、穩定）。可自行加關鍵字
# ------------------------------------------------------------
news:
  max_per_query: 8
  queries:
    - {q: "台股 大盤", lang: zh-TW}
    - {q: "外資 買超 OR 賣超", lang: zh-TW}
    - {q: "台積電", lang: zh-TW}
    - {q: "美股 收盤", lang: zh-TW}
    - {q: "Fed OR 聯準會 利率", lang: zh-TW}
    - {q: "stock market today", lang: en-US}
    - {q: "Nvidia OR semiconductor stocks", lang: en-US}
  watchlist_news: true          # 自選清單每檔再各抓幾則
  watchlist_news_per_symbol: 3

# ------------------------------------------------------------
#  報告輸出
# ------------------------------------------------------------
report:
  output_dir: docs              # GitHub Pages 從 main 分支的 docs/ 發布
  open_browser: true            # 產出後自動用預設瀏覽器打開
  plotly: cdn                   # cdn | inline（inline 會把 plotly.js 塞進 html，離線可看，檔案 +3MB）
  history_days: 120             # 走勢圖回看天數
  title: "每日市場報告"

# ------------------------------------------------------------
#  發布到 GitHub Pages：組版後自動 git commit + push
# ------------------------------------------------------------
publish:
  git_push: true                # false = 只產生檔案不推
  remote: origin
  branch: main
  description: "台股 × 美股，每個交易日兩份 AI 市場短評"   # 首頁副標

# ------------------------------------------------------------
#  AI 分析（Claude Code）
# ------------------------------------------------------------
ai:
  command: claude               # claude CLI 路徑
  model: ""                     # 留空 = 使用 Claude Code 預設；可填 opus / sonnet
  max_turns: 30
  allowed_tools: "Read,Write,Glob,Grep,WebSearch,WebFetch"

# 15:30 午報要等 TWSE 三大法人資料公布，最多等這麼久（分鐘）
pm_wait_for_data_minutes: 30
