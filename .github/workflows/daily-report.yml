# 整個流程在 GitHub Actions 上跑，Mac 不用開機。
# 需要 repo Settings → Secrets and variables → Actions 新增 CLAUDE_CODE_OAUTH_TOKEN
#（在 Mac 上執行 `claude setup-token` 取得；Max 訂閱可用，不另外計費）。
# 排程用 UTC：00:30 = 台北 08:30、07:30 = 台北 15:30，週一到週五。
# 手動觸發：Actions 頁面 → daily-report → Run workflow（可勾 skip_ai 只測資料抓取）。
name: daily-report

on:
  workflow_dispatch:
    inputs:
      session:
        description: "am 或 pm"
        required: true
        default: "am"
        type: choice
        options: [am, pm]
      skip_ai:
        description: "跳過 Claude 評論（測試資料抓取用）"
        type: boolean
        default: false
  schedule:
    - cron: "30 0 * * 1-5"   # 08:30 台北 = 00:30 UTC，週一到週五
    - cron: "30 7 * * 1-5"   # 15:30 台北 = 07:30 UTC

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Taipei
      NO_OPEN: "1"
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 決定 session（排程依 UTC 時間判斷；手動觸發用輸入值）
        id: s
        run: |
          if [ -n "${{ inputs.session }}" ]; then S="${{ inputs.session }}";
          elif [ "$(date -u +%H)" -lt 4 ]; then S=am; else S=pm; fi
          echo "session=$S" >> "$GITHUB_OUTPUT"
          echo "date=$(date +%F)" >> "$GITHUB_OUTPUT"
          echo "session=$S date=$(date +%F) (TZ=$TZ)"

      - name: 抓資料
        run: |
          WAIT=""; [ "${{ steps.s.outputs.session }}" = "pm" ] && WAIT="--wait"
          python -m fetch.run --session "${{ steps.s.outputs.session }}" $WAIT
          python - <<'PY'
          import json, glob
          f = sorted(glob.glob("data/*.json"))[-1]
          d = json.load(open(f))
          print("errors:", d["meta"]["errors"])
          print("tw taiex:", (d.get("tw") or {}).get("taiex", {}).get("last"), "| us spx:", ((d.get("us") or {}).get("indices") or {}).get("^GSPC", {}).get("last"))
          PY

      - uses: actions/setup-node@v5
        if: ${{ !inputs.skip_ai && env.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        with:
          node-version: "22"

      - name: Claude 評論
        if: ${{ !inputs.skip_ai && env.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        # 或改用 API 計費：env ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # 模型 / 思考深度 / 工具 / 回合數都讀 config.yaml 的 ai 區塊
        run: |
          npm install -g @anthropic-ai/claude-code
          eval "$(python - <<'PY'
          import yaml, shlex
          ai = yaml.safe_load(open("config.yaml")).get("ai", {})
          print("MODEL=" + shlex.quote(str(ai.get("model") or "")))
          print("EFFORT=" + shlex.quote(str(ai.get("effort") or "")))
          print("TOOLS=" + shlex.quote(str(ai.get("allowed_tools") or "Read,Write,Glob,Grep,WebSearch,WebFetch")))
          print("MAXT=" + shlex.quote(str(ai.get("max_turns") or 30)))
          PY
          )"
          ARGS=""
          [ -n "$MODEL" ] && ARGS="$ARGS --model $MODEL"
          [ -n "$EFFORT" ] && ARGS="$ARGS --effort $EFFORT"
          echo "claude -p /daily-brief ${{ steps.s.outputs.session }} --max-turns $MAXT $ARGS"
          claude -p "/daily-brief ${{ steps.s.outputs.session }} ${{ steps.s.outputs.date }}" \
            --allowedTools "$TOOLS" --max-turns "$MAXT" $ARGS \
            || echo "::warning::Claude 執行失敗，將以無評論版本組版"

      - name: 組版
        run: python -m build.build --session "${{ steps.s.outputs.session }}" --no-open

      - name: 推送到 main（GitHub Pages 會自動部署 docs/）
        run: |
          git config user.name "daily-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A docs data analysis
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "report: ${{ steps.s.outputs.date }}-${{ steps.s.outputs.session }} [actions]"
          git pull --rebase origin main
          git push origin HEAD:main
